<!DOCTYPE html>
<html>
<head><title>Test Stream</title></head>
<body>
<div id="output"></div>
<script>
const token = prompt('输入token:');
fetch('http://localhost:8080/api/chat/vision/stream', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + token
  },
  body: JSON.stringify({
    messages: [{role: 'user', content: [{type: 'text', text: '你好，请说一段话'}]}],
    options: {stream: true}
  })
}).then(response => {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  
  function read() {
    reader.read().then(({done, value}) => {
      if (done) return;
      const chunk = decoder.decode(value);
      document.getElementById('output').innerHTML += '<br>' + chunk;
      read();
    });
  }
  read();
});
</script>
</body>
</html>
